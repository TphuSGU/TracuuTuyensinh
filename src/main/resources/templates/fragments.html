<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title th:text="${title}">Cổng Tuyển Sinh</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#001b3c",
                        "outline": "#737780",
                        "inverse-on-surface": "#f0f1f2",
                        "on-secondary-fixed": "#191c1f",
                        "inverse-surface": "#2e3132",
                        "primary-fixed": "#d5e3ff",
                        "on-surface": "#191c1d",
                        "inverse-primary": "#a7c8ff",
                        "secondary": "#5c5f62",
                        "on-secondary-fixed-variant": "#44474a",
                        "primary-fixed-dim": "#a7c8ff",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#004491",
                        "surface-container-high": "#e7e8e9",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e1e3e4",
                        "error-container": "#ffdad6",
                        "background": "#f8f9fa",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#799dd6",
                        "surface-bright": "#f8f9fa",
                        "surface-container-highest": "#e1e3e4",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#001a40",
                        "surface-tint": "#3a5f94",
                        "on-tertiary-container": "#629afb",
                        "tertiary-fixed-dim": "#acc7ff",
                        "on-secondary-container": "#606366",
                        "tertiary": "#001d44",
                        "surface": "#f8f9fa",
                        "on-background": "#191c1d",
                        "surface-dim": "#d9dadb",
                        "on-error-container": "#93000a",
                        "outline-variant": "#c3c6d1",
                        "error": "#ba1a1a",
                        "primary": "#001e40",
                        "secondary-fixed": "#e0e2e6",
                        "secondary-container": "#dee0e4",
                        "primary-container": "#003366",
                        "surface-container": "#edeeef",
                        "tertiary-container": "#00316c",
                        "surface-container-low": "#f3f4f5",
                        "on-surface-variant": "#43474f",
                        "secondary-fixed-dim": "#c4c7ca",
                        "on-primary-fixed-variant": "#1f477b",
                        "tertiary-fixed": "#d7e2ff",
                        "success-container": "#d1e7dd",
                        "on-success-container": "#0f5132"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "unit": "4px",
                        "container-max": "1280px",
                        "stack-sm": "8px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "h3": ["Inter"],
                        "table-header": ["Inter"],
                        "h1": ["Inter"],
                        "h2": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "table-header": ["14px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "h1": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "h2": ["32px", {"lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-sm": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
    </style>
</head>
<body>

<!-- Standard Header Fragment -->
<nav th:fragment="header(activePage)" class="fixed top-0 w-full z-50 flex justify-between items-center px-gutter h-16 max-w-container-max mx-auto left-0 right-0 bg-surface border-b border-outline-variant flat no shadows">
    <div class="flex items-center gap-stack-md">
        <span aria-hidden="true" class="material-symbols-outlined text-primary text-3xl">school</span>
        <span class="font-h3 text-h3 text-primary">Cổng Tuyển Sinh Đại Học</span>
    </div>
    <div class="hidden md:flex gap-gutter items-center">
        <a th:class="${activePage == 'gioi-thieu' ? 'text-primary font-bold border-b-2 border-primary pb-1 transition-all opacity-80 font-body-md text-body-md' : 'text-on-surface-variant hover:text-primary-container transition-colors font-body-md text-body-md'}" th:href="@{/gioi-thieu}">Giới thiệu</a>
        <a th:class="${activePage == 'thong-tin' ? 'text-primary font-bold border-b-2 border-primary pb-1 transition-all opacity-80 font-body-md text-body-md' : 'text-on-surface-variant hover:text-primary-container transition-colors font-body-md text-body-md'}" th:href="@{/thong-tin-tuyen-sinh}">Thông tin tuyển sinh</a>
        <a th:class="${activePage == 'tracuu' ? 'text-primary font-bold border-b-2 border-primary pb-1 transition-all opacity-80 font-body-md text-body-md' : 'text-on-surface-variant hover:text-primary-container transition-colors font-body-md text-body-md'}" th:href="@{/tracuu}">Tra cứu kết quả</a>
        <a th:class="${activePage == 'dgnl' ? 'text-primary font-bold border-b-2 border-primary pb-1 transition-all opacity-80 font-body-md text-body-md' : 'text-on-surface-variant hover:text-primary-container transition-colors font-body-md text-body-md'}" th:href="@{/tinh-diem-dgnl}">Tính điểm ĐGNL</a>
        <a th:class="${activePage == 'vsat' ? 'text-primary font-bold border-b-2 border-primary pb-1 transition-all opacity-80 font-body-md text-body-md' : 'text-on-surface-variant hover:text-primary-container transition-colors font-body-md text-body-md'}" th:href="@{/tinh-diem-vsat}">Tính điểm VSAT/THPT</a>
    </div>
    <div class="flex items-center gap-4">
        <div sec:authorize="isAuthenticated()" class="flex items-center gap-3">
              <!-- <div class="flex flex-col items-end">
                <span class="font-label-sm text-label-sm text-primary font-bold" th:text="${#authentication.name}">User</span>
                <span class="text-[10px] text-on-surface-variant uppercase tracking-wider">ThÃ­ sinh</span>
              </div> -->
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="text-on-surface-variant hover:text-error transition-colors font-label-sm text-label-sm px-4 py-2 rounded border border-outline-variant flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">logout</span>
                  Đăng xuất 
                </button>
            </form>
        </div>
        <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}" class="bg-primary text-on-primary font-label-sm text-label-sm px-4 py-2 rounded hover:opacity-90 transition-opacity">Đăng nhập</a>
        </div>
    </div>
</nav>

<!-- Standard Footer Fragment -->
<footer th:fragment="footer" class="w-full py-stack-lg px-gutter mt-auto flex flex-col md:flex-row justify-between items-center gap-stack-md bg-surface-container border-t border-outline-variant text-on-surface-variant font-label-sm text-label-sm">
    <div class="flex items-center gap-stack-sm">
        <span class="font-h3 text-h3 text-primary">Cổng Tuyển Sinh</span>
        <span>© 2025 Hội đồng Tuyển Sinh Đại Học. Tất cả quyền được bảo lưu.</span>
    </div>
</footer>

</body>
</html>
