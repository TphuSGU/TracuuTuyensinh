<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng nhập - Tra cứu kết quả xét tuyển')}"></head>
<body class="antialiased min-h-screen flex flex-col pt-16">
<!-- TopNavBar -->
<nav th:replace="~{fragments :: header('')}"></nav>

<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-gutter py-stack-lg flex flex-col gap-stack-lg mt-stack-md items-center justify-center">
    <div class="w-full max-w-md flex flex-col gap-stack-md">
        <header class="text-center mb-stack-md">
            <h1 class="font-h1 text-h1 text-primary">Tra cứu kết quả</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant mt-stack-sm">Nhập thông tin để xem trạng thái hồ sơ tuyển sinh của bạn.</p>
        </header>

        <div th:if="${error != null}" class="bg-error-container border border-error-container rounded-lg p-stack-sm flex items-center gap-stack-sm mb-stack-sm">
            <span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">error</span>
            <p class="font-body-md text-on-error-container" th:text="${error}">Tên đăng nhập hoặc mật khẩu không đúng!</p>
        </div>

        <div th:if="${success != null}" class="bg-success-container border border-success-container rounded-lg p-stack-sm flex items-center gap-stack-sm mb-stack-sm">
            <span class="material-symbols-outlined text-on-success-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            <p class="font-body-md text-on-success-container" th:text="${success}">Đăng xuất thành công!</p>
        </div>

        <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-stack-md shadow-sm relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
            <form method="POST" action="/login" class="flex flex-col gap-stack-md">
                <div class="flex flex-col gap-unit">
                    <label class="font-label-sm text-label-sm text-on-surface" for="username">CCCD</label>
                    <input class="border border-outline-variant rounded px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-surface-bright" 
                           id="username" 
                           name="username" 
                           placeholder="Nhập số CCCD" 
                           type="text" 
                           required 
                           autofocus 
                           autocomplete="username"/>
                </div>
                <div class="flex flex-col gap-unit">
                    <label class="font-label-sm text-label-sm text-on-surface" for="password">Mật Khẩu</label>
                    <input class="border border-outline-variant rounded px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-surface-bright" 
                           id="password" 
                           name="password" 
                           placeholder="DDMMYYYY (8 chữ số)" 
                           type="password" 
                           required
                           autocomplete="current-password"/>
                    <!-- <p class="text-xs text-on-surface-variant mt-1">Ví dụ: ngày 05/03/2001 &rarr; mật khẩu: 05032001</p> -->
                </div>
                <button class="mt-stack-sm w-full bg-primary text-on-primary font-label-sm text-label-sm py-3 rounded hover:opacity-90 transition-opacity flex justify-center items-center gap-2" type="submit">
                    <span class="material-symbols-outlined text-sm">login</span>
                    <span id="btnText">Tra cứu</span>
                </button>
            </form>
        </div>
    </div>
</main> 

<!-- Footer -->
<footer th:replace="~{fragments :: footer}"></footer>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            console.log('Form is being submitted...');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            if (btn) {
                btn.disabled = true;
                btn.style.opacity = '0.7';
            }
            if (btnText) {
                btnText.innerText = 'Đang kiểm tra...';
            }
            // alert('Đang gửi yêu cầu đăng nhập...');
        });
    </script>
</body>
</html>
